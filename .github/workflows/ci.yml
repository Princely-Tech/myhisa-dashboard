name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [live, sandbox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build currently ignores type errors (next.config.mjs ignoreBuildErrors),
      # so existing errors are reported here without failing CI until they're fixed.
      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/
          NEXT_PUBLIC_ENVIRONMENT: ${{ matrix.environment }}
